name: Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pre-flight checks (no install needed)
        run: |
          node scripts/check.js
          node tests/ai-hub.test.js
