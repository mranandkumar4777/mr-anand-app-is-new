name: Build desktop app (Windows + macOS)

on:
  push:
    tags: ['v*.*.*']      # e.g. git tag v1.0.3 && git push origin v1.0.3
  workflow_dispatch:       # or run it by hand from the Actions tab - you MUST type a version
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.3 (must be HIGHER than the version users have installed)'
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # One place that decides the version, so the installer, latest.yml and desktop-version.json always agree.
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$INPUT_VERSION"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version '$V' is not like 1.2.3"; exit 1; fi
          echo "Releasing version $V"
          echo "v=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win --x64
          - os: macos-latest
            name: mac
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stamp the release version into package.json (always, tag push or manual run)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.v }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Install dependencies
        run: npm install
      - name: Pre-flight checks (syntax, packaged files, AI hub tests)
        run: |
          npm run check
          npm test
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificate: builds are unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [version, build]
    # Run even if the Mac build failed: Windows users get automatic updates, so a Mac failure must not block them.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: files
      - name: Verify the update feed before publishing
        shell: bash
        env:
          V: ${{ needs.version.outputs.v }}
        run: |
          ls -la files || true
          test -f files/latest.yml || { echo "::error::The Windows build produced no latest.yml - there is nothing for installed apps to update from."; exit 1; }
          grep -q "^version: $V\$" files/latest.yml || { echo "::error::latest.yml does not say version $V"; cat files/latest.yml; exit 1; }
          ls files/*.dmg >/dev/null 2>&1 || echo "::warning::Mac build is missing - publishing Windows only"
      - name: Publish the desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.v }}
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest"
          cat > files/desktop-version.json <<JSON
          {
            "version": "$V",
            "notes": "PRESENTER $V",
            "published": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "windows": "$BASE/PRESENTER-$V-win-x64.exe",
            "mac_arm64": "$BASE/PRESENTER-$V-mac-arm64.dmg",
            "mac_x64": "$BASE/PRESENTER-$V-mac-x64.dmg"
          }
          JSON
          cat files/desktop-version.json
          ls -la files
          gh release delete desktop-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create desktop-latest files/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Desktop $V" --notes "Latest desktop build ($V)"
