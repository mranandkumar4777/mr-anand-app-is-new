name: Build desktop app (Windows + macOS)

on:
  push:
    tags: ['v*.*.*']      # e.g. git tag v1.0.1 && git push origin v1.0.1
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win --x64
          - os: macos-latest
            name: mac
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the tag as the app version (v1.2.3 -> 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Install dependencies
        run: npm install
      - name: Pre-flight checks (syntax, packaged files, AI hub tests)
        run: |
          npm run check
          npm test
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificate: builds are unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: files
      - name: Publish the desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./package.json').version"); fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest"
          cat > files/desktop-version.json <<JSON
          {
            "version": "$V",
            "notes": "PRESENTER $V",
            "published": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "windows": "$BASE/PRESENTER-$V-win-x64.exe",
            "mac_arm64": "$BASE/PRESENTER-$V-mac-arm64.dmg",
            "mac_x64": "$BASE/PRESENTER-$V-mac-x64.dmg"
          }
          JSON
          cat files/desktop-version.json
          ls -la files
          gh release delete desktop-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create desktop-latest files/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Desktop $V" --notes "Latest desktop build ($V)"
